name: dailymuslim
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.6.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1 # 1.
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  get: ^4.7.3
  google_fonts: ^8.0.1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.0
  url_launcher: ^6.3.2
  zoom_tap_animation: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env

  fonts:
    - family: IrishGrover
      fonts:
        - asset: assets/fonts/IrishGrover-Regular.ttf
